name: CI

# Unit tests and a debug build of the flavor we ship, on every PR and on main. The upstream sync
# job waits on this before merging, so a merge that breaks the native build or the tests stops here.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install the NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" > /dev/null

      # Every runner would otherwise generate its own debug key, and an APK signed with one can't
      # update an install signed with another: the live test's emulator kept the first build it got
      # and streamed that one for every later test. The shared key is the developer machine's, so
      # CI builds also install over debug builds put on the Thor by hand. Absent on forks' PRs.
      - name: Shared debug key
        env:
          DEBUG_KEYSTORE: ${{ secrets.ZEFIRO_DEBUG_KEYSTORE }}
        run: |
          if [ -n "$DEBUG_KEYSTORE" ]; then
            echo "$DEBUG_KEYSTORE" | base64 -d > "$RUNNER_TEMP/debug.keystore"
            echo "ZEFIRO_DEBUG_KEYSTORE_FILE=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::ZEFIRO_DEBUG_KEYSTORE not set: this debug APK can't update an installed one"
          fi

      - name: Native parser tests
        run: sh app/src/test/native/run.sh

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testNonRoot_gameDebugUnitTest

      - name: Debug build
        run: ./gradlew --no-daemon :app:assembleNonRoot_gameDebug

      # A debug APK signed with any other key is useless to the live test, and nothing else would
      # notice: the first attempt at the shared key built fine and still signed with a fresh one.
      - name: Check the debug signature
        if: env.ZEFIRO_DEBUG_KEYSTORE_FILE != ''
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          cert=$("$apksigner" verify --print-certs app/build/outputs/apk/nonRoot_game/debug/app-nonRoot_game-universal-debug.apk | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          echo "debug certificate: $cert"
          [ "$cert" = "$EXPECTED_DEBUG_CERT_SHA256" ] || { echo "::error::debug APK not signed with the shared key"; exit 1; }
        env:
          EXPECTED_DEBUG_CERT_SHA256: f92e2eb6e4aa08c107185bfcea749e09e3aec0b3dfb80d99dbea5bc56d8cc16e

      # The live test installs this build on the emulator paired with the PC: the debug package
      # is the one paired there, so it is the one the test needs.
      - name: Keep the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: zefiro-debug-apk
          path: app/build/outputs/apk/nonRoot_game/debug/app-nonRoot_game-universal-debug.apk
          retention-days: 14

      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 7

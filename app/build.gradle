apply plugin: 'com.android.application'

// Release signing. The keystore lives in key/, and its credentials in local.properties; both are
// gitignored, so a checkout without them still builds — it just produces an unsigned release.
// Losing this keystore means no device can ever update an installed Zefiro again, only
// reinstall it from scratch, so it wants a backup somewhere durable.
def keystorePropsFile = rootProject.file("local.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def releaseKeystorePath = keystoreProps["zefiro.keystore"]
def releaseKeystore = releaseKeystorePath != null ? rootProject.file(releaseKeystorePath) : null
def hasReleaseSigning = releaseKeystore != null && releaseKeystore.exists()
// Betas ship as their own app (-PbetaChannel, set by the release workflow for suffixed tags), so
// one can be tried next to the stable and dropped without a downgrade, which Android only allows
// by uninstalling (losing the pairing and settings).
def betaChannel = project.hasProperty('betaChannel')
// Debug signing with a shared key, when CI provides one: an APK signed with another key can't update
// an installed debug build, so the live test's emulator kept its first build. Named explicitly
// rather than dropped into ~/.android, where the CI build did not pick it up.
def sharedDebugKeystorePath = System.getenv("ZEFIRO_DEBUG_KEYSTORE_FILE")
def sharedDebugKeystore = sharedDebugKeystorePath ? file(sharedDebugKeystorePath) : null

android {
    ndkVersion "27.0.12077973"

    // The Beta app's icon carries a BETA ribbon (tools/brand/make_icons.py): its resources sit on
    // top of main's in the release build that becomes a beta.
    if (betaChannel) {
        sourceSets.release.res.srcDirs += 'src/beta/res'
    }

    compileSdk = 36

    namespace 'com.limelight'

    defaultConfig {
        minSdk 21
        targetSdk 34

        versionName "1.1.0-beta.5"
        versionCode = 69

        // English only. The translations come from upstream and cover well under half of the
        // strings, and none of Zefiro's own, so a translated device saw a mix of languages.
        resourceConfigurations += ['en']

        // Generate native debug symbols to allow Google Play to symbolicate our native crashes
        ndk.debugSymbolLevel = 'FULL'
    }

    signingConfigs {
        if (sharedDebugKeystore != null && sharedDebugKeystore.exists()) {
            debug {
                storeFile sharedDebugKeystore
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
        if (hasReleaseSigning) {
            release {
                storeFile releaseKeystore
                storePassword keystoreProps["zefiro.keystorePassword"]
                keyAlias keystoreProps["zefiro.keyAlias"]
                keyPassword keystoreProps["zefiro.keyPassword"]
            }
        }
    }

    flavorDimensions.add("root")

    buildFeatures {
        buildConfig = true
    }

    productFlavors {
        root {
            // Android O has native mouse capture, so don't show the rooted
            // version to devices running O on the Play Store.
            maxSdk 25

            externalNativeBuild {
                ndkBuild {
                    arguments "PRODUCT_FLAVOR=root"
                }
            }

            resValue "string",
                    "obtainium_app_url",
                    "data:text/html;base64,PGgxPlJvb3QgYnVpbGQgaXMgbm90IGF2YWlsYWJsZTwvaDE+"

            applicationId "dev.kylobyte.zefiro.root"
            dimension "root"
            buildConfigField "boolean", "ROOT_BUILD", "true"
        }

        nonRoot_game {
            externalNativeBuild {
                ndkBuild {
                    arguments "PRODUCT_FLAVOR=nonRoot"
                }
            }

            resValue "string",
                    "obtainium_app_url",
                    "https://apps.obtainium.imranr.dev/redirect?r=obtainium://app/%7B%22id%22%3A%22dev.kylobyte.zefiro%22%2C%22url%22%3A%22https%3A%2F%2Fgithub.com%2FDanieleS%2Fzefiro%22%2C%22author%22%3A%22DanieleS%22%2C%22name%22%3A%22Zefiro%22%2C%22additionalSettings%22%3A%22%7B%5C%22apkFilterRegEx%5C%22%3A%5C%22%5Ezefiro-nonRoot%5C%22%2C%5C%22matchGroupToUse%5C%22%3A%5C%22%241%5C%22%2C%5C%22versionExtractionRegEx%5C%22%3A%5C%22v%28.%2B%29%5C%22%7D%22%7D"

            applicationId "dev.kylobyte.zefiro"
            dimension "root"
            buildConfigField "boolean", "ROOT_BUILD", "false"
        }
    }

    compileOptions {
        encoding "UTF-8"
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        disable 'MissingTranslation'
        lintConfig file('lint.xml')
    }

    bundle {
        language {
            // Avoid splitting by language, since we allow users
            // to manually switch language in settings.
            enableSplit = false
        }
        density {
            // FIXME: This should not be necessary but we get
            // weird crashes due to missing drawable resources
            // when this split is enabled.
            enableSplit = false
        }
    }

    packaging {
        resources {
            pickFirsts.add('META-INF/versions/9/OSGI-INF/MANIFEST.MF')
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            resValue "string", "app_label", "Zefiro Debug"
            resValue "string", "app_label_root", "Zefiro Debug (Root)"
            resValue "string", "app_label_game", "Zefiro Debug (Game)"

            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        release {
            // To whomever is releasing/using an APK in release mode with
            // Moonlight's official application ID, please stop. I see every
            // single one of your crashes in my Play Console and it makes
            // Moonlight's reliability look worse and makes it more difficult
            // to distinguish real crashes from your crashy VR app. Seriously,
            // 44 of the *same* native crash in 72 hours and a few each of
            // several other crashes.
            //
            // This is technically not your fault. I would have hoped Google
            // would validate the signature of the APK before attributing
            // the crash to it. I asked their Play Store support about this
            // and they said they don't and don't have plans to, so that sucks.
            //
            // In any case, it's bad form to release an APK using someone
            // else's application ID. There is no legitimate reason, that
            // anyone would need to comment out the following line, except me
            // when I release an official signed Moonlight build. If you feel
            // like doing so would solve something, I can tell you it will not.
            // You can't upgrade an app while retaining data without having the
            // same signature as the official version. Nor can you post it on
            // the Play Store, since that application ID is already taken.
            // Reputable APK hosting websites similarly validate the signature
            // is consistent with the Play Store and won't allow an APK that
            // isn't signed the same as the original.
            //
            // I wish any and all people using Moonlight as the basis of other
            // cool projects the best of luck with their efforts. All I ask
            // is to please change the applicationId before you publish.
            //
            // TL;DR: don't publish under someone else's applicationId.
            // Ours is set per flavor above: dev.kylobyte.zefiro.
            if (betaChannel) {
                applicationIdSuffix ".beta"
                resValue "string", "app_label", "Zefiro Beta"
                resValue "string", "app_label_root", "Zefiro Beta (Root)"
                resValue "string", "app_label_game", "Zefiro Beta (Game)"
            } else {
                resValue "string", "app_label", "Zefiro"
                resValue "string", "app_label_root", "Zefiro (Root)"
                resValue "string", "app_label_game", "Zefiro (Game)"
            }

            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }

            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        ndkBuild {
            path "src/main/jni/Android.mk"
        }
    }

    splits {
        abi {
            enable true
            reset()
            include "x86", "x86_64", "armeabi-v7a", "arm64-v8a"
            // Also emit the all-ABI APK. It is the one the GitHub release ships and Obtainium
            // installs: its filter matches a single artifact, and one universal download spares
            // users from having to know their device's ABI.
            universalApk true
        }
    }

    testOptions {
        unitTests.includeAndroidResources = true
        // Robolectric runs every test in one JVM, and a main screen a test leaves running stays
        // reachable after it: from Mockito's inline mocks (the stub binder records the host
        // repository that holds the app), RecyclerView's per-thread GapWorker, the transitions
        // still pending and ProfilesManager's listeners. Gradle's default 512 MB ran out once
        // the screens grew, failing a random late test or wedging the worker with no result.
        unitTests.all {
            maxHeapSize = "2g"
        }
    }
}

dependencies {
    implementation 'org.bouncycastle:bcprov-jdk18on:1.81'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.81'
    implementation 'org.jcodec:jcodec:0.2.5'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jmdns:jmdns:3.6.2'
    implementation 'com.github.cgutman:ShieldControllerExtensions:1.0.1'
    implementation 'com.google.code.gson:gson:2.13.1'
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.documentfile:documentfile:1.1.0'
    // Declared rather than left to arrive through appcompat and material: the main screen hosts its
    // sections as fragments backed by ViewModel and LiveData, so these are direct dependencies, and
    // their versions should not hinge on whatever another library happens to require.
    implementation 'androidx.fragment:fragment:1.8.5'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.7'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    implementation 'com.google.ai.edge.litert:litert:1.4.0'
    implementation 'com.google.ai.edge.litert:litert-gpu:1.4.0'
    implementation 'org.opencv:opencv:4.12.0'

    // Unit test dependencies
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'androidx.test:core:1.7.0'
    testImplementation 'org.robolectric:robolectric:4.16'
    testImplementation 'org.mockito:mockito-core:5.19.0'
}
